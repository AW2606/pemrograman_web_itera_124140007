<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Praktikum - Pertemuan 1</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
    h2 { margin-top: 28px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 6px; white-space: pre-wrap; }
    input, button { padding: 6px 10px; margin: 2px; }

  <h1>Latihan Pertemuan 1 (Versi D)</h1>

  <h2>Kalkulator BMI</h2>

  <button id="btn-bmi">Hitung BMI</button>
  <p id="hasil-bmi"></p>

  <script src="latihan.js"></script>
